services:
  - type: web
    name: tabish-web
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: EMAIL_PROVIDER_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Tabish Web <onboarding@resend.dev>"
      - key: INQUIRY_TO
        value: "ta480105@gmail.com"
      - key: WHATSAPP_NUMBER
        value: "919507375721"
